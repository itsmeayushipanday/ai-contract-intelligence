spring:
  application:
    name: contract-intelligence-backend
  config:
    # Local development: read the git-ignored .env file at the repo root, so the DB password never has
    # to be typed into the terminal. "optional:" means a missing file is fine (e.g. in production).
    # The first path works when started from backend/, the second from the repo root.
    # A real environment variable of the same name still takes precedence over the file.
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:contracts}
    username: ${POSTGRES_USER:contracts_user}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # Spring rejects oversized uploads early; PdfFileValidator enforces the same limit again.
      max-file-size: ${app.upload.max-file-size}
      # a little larger than the file limit to allow for multipart boundary overhead
      max-request-size: 11MB
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50

app:
  upload:
    max-file-size: 10MB
  storage:
    # Relative paths are resolved from the folder the app is started in (backend/).
    location: ${STORAGE_LOCATION:./uploads}

server:
  tomcat:
    # When an upload is rejected as too large, Tomcat reads and discards the rest of the request body
    # (up to this limit) so the browser can actually receive our 413 message. With the default of 2MB
    # it drops the connection instead, which browsers report as "Failed to fetch". Bounded on purpose:
    # an unlimited value would let anyone make the server read gigabytes just to throw them away.
    max-swallow-size: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
